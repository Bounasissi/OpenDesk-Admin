name: CI

on:
  push:
    branches: [main, canonical-091326]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Lint (warnings as errors)
        run: swift build --build-tests --scratch-path .build-lint -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: License check
        run: ./scripts/license-check.sh
